<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
<title id="title">Архитектура DB Regression Hunter</title><desc id="desc">Демо нагружает PostgreSQL. Hunter собирает статистику, обнаруживает инциденты и отправляет отчёты в Telegram. Prometheus и Grafana показывают метрики. Для объяснения используется опциональная LLM с обезличенным контекстом.</desc>
