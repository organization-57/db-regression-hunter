services:
  hunter:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://hunter:hunter@postgres:5432/demo?sslmode=disable}
      HTTP_ADDR: :8080
      POLL_INTERVAL: ${POLL_INTERVAL:-10s}
      BASELINE_SAMPLES: ${BASELINE_SAMPLES:-20}
      DEGRADATION_FACTOR: ${DEGRADATION_FACTOR:-3}
      CONFIRM_SAMPLES: ${CONFIRM_SAMPLES:-3}
      SQL_STATS_ENABLED: ${SQL_STATS_ENABLED:-true}
      SQL_MIN_CALLS: ${SQL_MIN_CALLS:-5}
      SQL_MIN_INCREASE_MS: ${SQL_MIN_INCREASE_MS:-5}
      RECOVERY_SAMPLES: ${RECOVERY_SAMPLES:-3}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000/d/hunter/postgresql-investigation}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      demo:
        condition: service_healthy
  demo:
    build: .
    entrypoint: ["/usr/local/bin/demo"]
    restart: unless-stopped
    environment:
      # Deliberately independent of the monitored DATABASE_URL.
      DEMO_DATABASE_URL: postgres://demo:demo@postgres:5432/demo?sslmode=disable&application_name=hunter-demo
      POLL_INTERVAL: ${POLL_INTERVAL:-10s}
      BASELINE_SAMPLES: ${BASELINE_SAMPLES:-20}
      CONFIRM_SAMPLES: ${CONFIRM_SAMPLES:-3}
      DEMO_WARMUP: ${DEMO_WARMUP:-}
      DEMO_INCIDENT_DURATION: ${DEMO_INCIDENT_DURATION:-}
      DEMO_COOLDOWN: ${DEMO_COOLDOWN:-3m}
      DEMO_SCENARIOS: ${DEMO_SCENARIOS:-row_lock,slow_report,table_lock,lock_chain,temp_spill,session_burst,deadlock}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/demo-ready"]
      interval: 2s
      timeout: 2s
      retries: 60
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=on"]
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-hunter.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.2.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
